name: real-tools

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  real-tools:
    name: Real tools (${{ matrix.os }} · node 26)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CODEX_LSP_REAL_TOOLS: "1"
      CODEX_LSP_ARTIFACTS: test-results/real-tools
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "26.13.0"
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.27.3"
          cache: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.13.6"
          python-version: "3.13"
      - name: Select repository npm and install dependencies
        run: |
          npm install --global npm@12.2.1
          npm ci --ignore-scripts
      - name: Install pinned Python and Go tools
        run: |
          uv tool install ruff==0.17.3
          uv tool install ty==0.0.95
          go install golang.org/x/tools/gopls@v0.24.0
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .cache/ci-llvm-23.1.4
          key: llvm-23.1.4-${{ runner.os }}-x64-v1
      - name: Prepare verified LLVM tools
        run: node scripts/real-tools-ci.mjs prepare
      - name: Verify committed bundle matches sources
        run: |
          npm run check
          git diff --exit-code -- dist
      - name: Run real tools with no skipped acceptance cases
        run: npm run test:features:ci
      - name: Save acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: real-tools-${{ matrix.os }}
          path: test-results/real-tools/
          if-no-files-found: error
          retention-days: 14
