name: rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      # Matched compiler, standard library sources, analyzer and formatter.
      # https://blog.rust-lang.org/2026/10/15/Rust-1.99.1/
      RUSTUP_TOOLCHAIN: "1.99.1"
      RUSTUP_AUTO_INSTALL: "0"
      CARGO_NET_OFFLINE: "true"
      CARGO_BUILD_JOBS: "2"
      RAYON_NUM_THREADS: "4"
      CODEX_LSP_RUST_ARTIFACTS: test-results/rust
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: false
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.20.0"
      - name: Prepare pinned Rust tools on the runner
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rust-analyzer,rust-src,rustfmt
      - name: Record tool versions
        run: |
          mkdir -p "$CODEX_LSP_RUST_ARTIFACTS"
          node --version > "$CODEX_LSP_RUST_ARTIFACTS/versions.txt"
          rustc --version --verbose >> "$CODEX_LSP_RUST_ARTIFACTS/versions.txt"
          cargo --version >> "$CODEX_LSP_RUST_ARTIFACTS/versions.txt"
          rust-analyzer --version >> "$CODEX_LSP_RUST_ARTIFACTS/versions.txt"
          rustfmt --version >> "$CODEX_LSP_RUST_ARTIFACTS/versions.txt"
      - name: Verify Rust through the committed bundle
        # The standalone bundle and Node-only harness need no npm installation.
        run: npm run test:rust 2>&1 | tee "$CODEX_LSP_RUST_ARTIFACTS/tests.txt"
      - name: Save Rust acceptance evidence
        if: always()
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-${{ matrix.os }}
          path: test-results/rust/
          if-no-files-found: warn
          retention-days: 14
